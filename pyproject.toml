[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "falsify-giskard"
version = "0.2.0"
description = "PRML pre-registration integration for Giskard scenario results"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Cüneyt Öztürk", email = "hello@falsify.dev" },
]
keywords = ["prml", "giskard", "evaluation", "pre-registration", "ml", "ai-safety", "reproducibility", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "falsify>=0.3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
giskard = ["giskard-checks>=1.0.0b1"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://falsify.dev"
Spec = "https://spec.falsify.dev/v0.1"
Repository = "https://github.com/studio-11-co/falsify-giskard"
Issues = "https://github.com/studio-11-co/falsify-giskard/issues"

[tool.hatch.build.targets.wheel]
packages = ["falsify_giskard"]
