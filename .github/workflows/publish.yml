name: Publish to PyPI

# Triggered on a tag push (e.g. v0.1.0). Builds the dist and publishes
# via PyPI Trusted Publishers (OIDC). No API token required.
#
# Initial setup (one-time, on PyPI side):
#   1. Reserve the project name by creating a "pending publisher" at
#      https://pypi.org/manage/account/publishing/ with:
#        - Project name:   falsify-giskard
#        - Owner:          studio-11-co
#        - Repository:     falsify-giskard
#        - Workflow name:  publish.yml
#        - Environment:    pypi          (must match the `environment:` below)
#   2. After the first successful publish, the project converts to a
#      regular trusted publisher.
# Docs: https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC trust to PyPI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel
        run: python -m build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/falsify-giskard
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
